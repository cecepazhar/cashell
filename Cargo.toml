[package]
name = "cashell"
version = "0.1.0"
edition = "2021"
description = "CA ecosystem CLI — universal shell for Cecep Azhar tools"
authors = ["Cecep Saeful Azhar Hidayat, ST"]
license = "MIT"
repository = "https://github.com/cecepazhar/cashell"
readme = "README.md"
rust-version = "1.75"

[lib]
name = "cashell"
path = "src/lib.rs"

[[bin]]
name = "cashell"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
colored = "3"
ratatui = { version = "0.29.0", features = ["crossterm"] }
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1

[profile.release-lto]
inherits = "release"
lto = "fat"
