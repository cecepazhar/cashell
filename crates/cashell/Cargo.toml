[package]
name = "cashell"
version = "1.0.2"
edition = "2021"
description = "CA ecosystem CLI — universal shell for Cecep Azhar tools"
authors = ["Cecep Saeful Azhar Hidayat, ST"]
license = "MIT"
repository = "https://github.com/cecepazhar/cashell"
readme = "../../README.md"
rust-version = "1.75"

[lib]
name = "cashell"
path = "src/lib.rs"

[[bin]]
name = "cashell"
path = "src/main.rs"

[dependencies]
cashell-common = { path = "../common", version = "1.0.2" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
colored = "3"
git2 = "0.19"
rayon = "1.10"
sha2 = "0.10"
hmac = "0.12"
ratatui = { version = "0.29.0", features = ["crossterm"] }
crossterm = "0.28"
sysinfo = "0.31"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8" }
ed25519-dalek = "2.1.1"
argon2 = "0.5.3"
aes-gcm = "0.10.3"
machine-uid = "0.6.0"
base64ct = { version = "1.6.0", features = ["alloc"] }
rand = "0.8"
