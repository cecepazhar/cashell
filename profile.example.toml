# ==============================================================================
# Fathforce & CAShell Personal Profile Template
# Import via: cashell config import ~/.config/cashell/profile.toml
# Or press [i] inside CAShell Cockpit Analytics tab
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Fleet Server Nodes (Tab [4] Server)
# ------------------------------------------------------------------------------
[nodes.local]
ip = "127.0.0.1"
user = "cecepazhar"
active = true
services = [
    { name = "9router", port = 20128, protocol = "http" },
    { name = "cashell-daemon", port = 8090, protocol = "http" }
]

[nodes."YPC"]
ip = "100.127.232.32"
user = "root"
active = true
services = [
    { name = "dokploy", port = 3000, protocol = "http" },
    { name = "ssh", port = 22, protocol = "tcp" }
]

[nodes."Hostinger VPS"]
ip = "100.76.150.46"
user = "root"
active = true
services = [
    { name = "http", port = 80, protocol = "http" },
    { name = "admin", port = 8443, protocol = "https" },
    { name = "ssh", port = 22, protocol = "tcp" }
]

[nodes."Tencent Cloud VPS"]
ip = "43.157.208.83"
user = "root"
active = true
services = [
    { name = "ssh", port = 22, protocol = "tcp" },
    { name = "traefik", port = 80, protocol = "http" },
    { name = "content-hub", port = 8096, protocol = "http" },
    { name = "caorch", port = 8091, protocol = "http" }
]

[nodes."XPC"]
ip = "100.125.125.28"
user = "root"
active = true
services = [
    { name = "ssh", port = 22, protocol = "tcp" }
]

[nodes."pc-gerlink"]
ip = "100.102.147.90"
user = "root"
active = true
services = [
    { name = "http", port = 80, protocol = "http" },
    { name = "ssh", port = 22, protocol = "tcp" }
]

